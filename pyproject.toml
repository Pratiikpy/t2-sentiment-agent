[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "t2-sentiment-agent"
version = "0.1.0"
description = "A market-sentiment trading agent: Qwen decides, a risk kernel that can only reduce gates, and Bitget Agent Hub places paper orders on Bitget's Demo environment."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md", "third_party/argus/LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Prateek" }]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
# Runtime dependencies are deliberately two. Everything that talks to the network uses the standard
# library, so the surface a reviewer has to trust is small. `tzdata` is required because Windows
# ships no IANA database and the US-open heartbeat is computed in America/New_York.
dependencies = [
  "pydantic>=2.12,<3",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.16",
  "mypy>=2.0",
]
# The finBERT rival arm (rivals/finbert_arm.py) runs offline on the recorded snapshots only.
rivals = [
  "transformers>=4.38",
  "torch>=2.2",
]
# OpenTimestamps anchoring of the genesis and daily head hashes (ledger/anchor.py shells out to `ots`).
anchor = [
  "opentimestamps-client>=0.7",
]
# Scripted demo video (scripts/record_video.py).
video = [
  "playwright>=1.45",
]

[project.scripts]
t2sa = "sentiment_agent.runtime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentiment_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
# validation/ holds the as-run measurement scripts the policy numbers come from. They are evidence,
# kept byte-for-byte apart from their input paths, not library code.
extend-exclude = ["validation", "playbook"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # import order
  "B",             # bugbear
  "UP",            # pyupgrade
  "SIM",           # simplify
  "RUF",           # ruff-specific
  "S",             # bandit: subprocess, hashing, secrets
  "PT",            # pytest style
  "N",             # naming
  "C4",            # comprehensions
  "DTZ",           # every datetime must carry a timezone
  "T20",           # no stray print() in library code
]
ignore = [
  "RUF001", "RUF002", "RUF003",  # ambiguous unicode: prompts and docs quote real text
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "T20"]
"scripts/**" = ["T20"]
# The only two modules allowed to start subprocesses, each with a fixed argv built in code.
"src/sentiment_agent/execution/bgc.py" = ["S603"]
"src/sentiment_agent/execution/environment.py" = ["S603"]
"src/sentiment_agent/crowd/adapters.py" = ["S603"]
"src/sentiment_agent/ledger/anchor.py" = ["S603"]
"src/sentiment_agent/runtime/cli.py" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src:tests:scripts"
files = ["src", "tests", "scripts"]
warn_unreachable = true
explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
  "live_public: calls a keyless public Bitget endpoint (never a private endpoint, never an order, never Qwen). Skipped unless --run-live-public is given.",
]
